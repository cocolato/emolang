AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  SuggestExtensions: false

Style/Documentation:
  Enabled: false

# Legacy v0.1 keeps Ruby methods with emoji names and evals by design.
Naming/AsciiIdentifiers:
  Exclude:
    - 'lib/emolang/legacy.rb'

Naming/MethodName:
  Exclude:
    - 'lib/emolang/legacy.rb'

Naming/PredicateMethod:
  Exclude:
    - 'lib/emolang/legacy.rb'

Security/Eval:
  Exclude:
    - 'lib/emolang/legacy.rb'

# Emolang's own "#{...}" interpolation appears in single-quoted Ruby strings.
Lint/InterpolationCheck:
  Exclude:
    - 'test/**/*'

# Interpreter core is dense case dispatch by design.
Metrics:
  Exclude:
    - 'lib/emolang/**/*'
    - 'test/**/*'
